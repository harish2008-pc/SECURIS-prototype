<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Securis — Intelligent Banking & Proactive Guardian Shield</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            securis: {
              primary: '#0ea5e9',
              shield: '#10b981',
              warning: '#f59e0b',
              danger: '#ef4444',
              dark: '#090d16',
              card: '#111827',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans selection:bg-sky-500 selection:text-white">

  <!-- ========================================================================= -->
  <!-- TOP APP BAR & ROLE SWITCHER                                               -->
  <!-- ========================================================================= -->
  <header class="border-b border-slate-800 bg-slate-900/90 backdrop-blur-md sticky top-0 z-50 px-4 sm:px-6 py-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
      
      <!-- Brand Logo -->
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-600 via-indigo-600 to-emerald-400 flex items-center justify-center shadow-lg shadow-sky-500/20">
          <i class="fa-solid fa-shield-halved text-xl text-white"></i>
        </div>
        <div>
          <div class="flex items-center space-x-2">
            <span class="text-xl font-black tracking-tight text-white">SECURIS</span>
            <span class="px-2 py-0.5 text-[10px] font-bold rounded-full bg-sky-500/20 text-sky-300 border border-sky-500/30">v1.1 Security Suite</span>
          </div>
          <p class="text-[11px] text-slate-400 hidden sm:block">Proactive Digital Financial Protection Platform</p>
        </div>
      </div>

      <!-- VIEW / ROLE SELECTOR (Centerpiece) -->
      <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800">
        <button id="nav-btn-user" onclick="switchView('user')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 bg-emerald-600 text-white shadow-md">
          <i class="fa-solid fa-user-shield"></i>
          <span>Customer (Senior UI)</span>
        </button>
        <button id="nav-btn-guardian" onclick="switchView('guardian')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white">
          <i class="fa-solid fa-user-gear"></i>
          <span>Guardian Portal</span>
        </button>
        <button id="nav-btn-dual" onclick="switchView('dual')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white">
          <i class="fa-solid fa-table-columns"></i>
          <span>Dual View</span>
        </button>
      </div>

      <!-- CONTROLLER TOOLBAR: TIERED SCENARIO TRIGGERS, CALL SIMULATOR & LANGUAGE -->
      <div class="flex items-center flex-wrap gap-2">
        
        <!-- Preset 1: Safe <10k -->
        <button onclick="triggerScenario('safe')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-emerald-600/30 text-emerald-400 border border-emerald-500/30 transition flex items-center" title="Under 10k: Direct Biometric Approval">
          <i class="fa-solid fa-circle-check mr-1.5 text-emerald-400"></i> ≤₹10k (Safe)
        </button>

        <!-- Preset 2: >10k Guardian Approval -->
        <button onclick="triggerScenario('over10k')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-amber-950/60 hover:bg-amber-900/80 text-amber-300 border border-amber-500/40 transition flex items-center" title="Over 10k: Requires Guardian Approval">
          <i class="fa-solid fa-user-check mr-1.5 text-amber-400"></i> >₹10k (Guardian)
        </button>

        <!-- Preset 3: >50k Dual OTP -->
        <button onclick="triggerScenario('over50k')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-950/70 hover:bg-rose-900 text-rose-300 border border-rose-500/40 transition flex items-center" title="Over 50k: Requires Dual OTP Verification">
          <i class="fa-solid fa-key mr-1.5 text-rose-400"></i> >₹50k (Dual OTP)
        </button>

        <!-- Preset 4: New Payee Warning -->
        <button onclick="triggerScenario('newPayee')" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-950/60 hover:bg-indigo-900 text-indigo-300 border border-indigo-500/40 transition flex items-center" title="Select or Enter New Payee">
          <i class="fa-solid fa-user-plus mr-1.5 text-indigo-400"></i> New Payee
        </button>

        <!-- Active Call Toggle -->
        <button id="btn-call-toggle" onclick="toggleActiveCall()" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 transition flex items-center">
          <i id="call-icon" class="fa-solid fa-phone-slash mr-1.5 text-slate-400"></i>
          <span id="call-text">Call: Off</span>
        </button>

        <!-- Language Selector -->
        <select id="lang-select" onchange="changeLanguage(this.value)" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 outline-none focus:ring-1 focus:ring-sky-500">
          <option value="en-US">🗣️ English</option>
          <option value="hi-IN">🗣️ हिन्दी (Hindi)</option>
          <option value="te-IN">🗣️ తెలుగు (Telugu)</option>
          <option value="es-ES">🗣️ Español</option>
        </select>

        <!-- Reset Button -->
        <button onclick="resetSecurisData()" class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition" title="Reset all data & balance">
          <i class="fa-solid fa-rotate-left"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ========================================================================= -->
  <!-- MAIN APP CONTAINER                                                        -->
  <!-- ========================================================================= -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 flex flex-col justify-center">

    <!-- VIEW 1: STANDALONE USER / CUSTOMER UI (Senior Citizen / Vulnerable View) -->
    <section id="view-user-standalone" class="w-full max-w-xl mx-auto flex flex-col items-center">
      <div id="user-ui-mount" class="w-full"></div>
    </section>

    <!-- VIEW 2: STANDALONE GUARDIAN COMPANION PORTAL                           -->
    <section id="view-guardian-standalone" class="hidden w-full max-w-4xl mx-auto">
      <div id="guardian-ui-mount" class="w-full"></div>
    </section>

    <!-- VIEW 3: DUAL PRESENTATION VIEW (Side-by-Side Synchronized Simulator)     -->
    <section id="view-dual-presentation" class="hidden w-full">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 items-start justify-center max-w-6xl mx-auto">
        <div class="flex flex-col items-center">
          <div class="text-xs font-bold text-emerald-400 uppercase tracking-wider mb-2 flex items-center">
            <i class="fa-solid fa-user-shield mr-1.5"></i> Customer Device (Grandpa Rao)
          </div>
          <div id="user-dual-mount" class="w-full max-w-[390px]"></div>
        </div>
        <div class="flex flex-col items-center">
          <div class="text-xs font-bold text-sky-400 uppercase tracking-wider mb-2 flex items-center">
            <i class="fa-solid fa-user-gear mr-1.5"></i> Guardian Device (Son Ramesh)
          </div>
          <div id="guardian-dual-mount" class="w-full max-w-[390px]"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- GLOBAL NOTIFICATION TOAST -->
  <div id="global-toast" class="fixed bottom-6 right-6 hidden z-50 bg-slate-900 border border-slate-700 text-white text-xs font-semibold px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-2.5 animate-slide-up">
    <div id="toast-icon" class="w-5 h-5 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center">✓</div>
    <span id="toast-message">Notification</span>
  </div>

  <footer class="border-t border-slate-900 py-3 text-center text-xs text-slate-500">
    Securis v1.1 • Tiered Limits: >₹10k Guardian Co-Sign • >₹50k Dual OTP • Mini Securis AI
  </footer>

  <script src="app.js"></script>
</body>
</html>
